<title>Dreamscrol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Young+Serif&display=swap">
<style>
/* Layout: one phone-shaped frame; a full-height snap feed of listing "videos" with overlays floating on top. Single dark look, like any video feed. */
:root{
  --ink:#0f0d13;      /* page ground */
  --night:#1a1720;    /* panels and sheets */
  --raise:#252130;    /* raised rows */
  --line:rgba(255,255,255,.13);
  --glass:rgba(16,14,20,.56);
  --text:#f7f3ee;
  --muted:#b3acbc;
  --porch:#ffc46b;    /* accent: porch light */
  --porch-ink:#2a1d07;
  --heart:#ff5c7c;
  --match:#7fe3c4;
  --black:#000;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);display:grid;place-items:center;overflow:hidden;
  padding-block:12px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--porch);outline-offset:2px;border-radius:8px}

.phone{position:relative;width:min(100%,420px);height:100%;max-height:880px;border-radius:28px;overflow:hidden;overflow:clip;background:var(--black);
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px var(--line)}

/* top bar */
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 0}
.mark{min-width:0;font-family:var(--display);font-size:23px;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.mark .moon{width:14px;height:14px;border-radius:50%;box-shadow:inset -4px -1px 0 0 var(--porch);transform:rotate(-20deg)}
.mark small{font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 6px;margin-left:2px}
.toggles{display:flex;gap:6px;flex:none}
.tog{font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.tog[aria-pressed="true"]{background:var(--porch);color:var(--porch-ink);border-color:transparent}
.tog.cpl[aria-pressed="true"]{background:var(--match);color:#06281e}

/* feed */
.feed{position:absolute;inset:0 0 64px 0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.media{position:absolute;inset:0}
.media svg{width:100%;height:100%;display:block;transform-origin:50% 62%;transform:scale(1.04)}
.card.active .media svg{animation:kb 3.6s ease-out forwards,fadein .45s ease-out}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.15) translateY(-1.5%)}}
@keyframes fadein{from{opacity:.25}to{opacity:1}}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 20%,transparent 42%,rgba(0,0,0,.86) 88%)}

.segs{position:absolute;top:56px;left:14px;right:14px;display:flex;gap:4px;z-index:2}
.segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.segs b{display:block;height:100%;width:0;background:var(--text)}
.segs i.done b{width:100%}
.segs i.on b{animation:fill 3.5s linear forwards}
@keyframes fill{to{width:100%}}
.room{position:absolute;top:68px;left:14px;z-index:2;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.quote{position:absolute;left:22px;right:84px;top:34%;z-index:2;font-family:var(--display);font-size:22px;line-height:1.25;text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.7);animation:fadein .6s ease-out}
.quote span{display:block;margin-top:8px;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--porch)}

/* right rail */
.rail{position:absolute;right:8px;bottom:22px;z-index:3;display:flex;flex-direction:column;gap:14px;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;min-width:52px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.act svg{width:32px;height:32px;fill:var(--text);filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));transition:transform .15s}
.act:active svg{transform:scale(.88)}
.act.on.like svg{fill:var(--heart)}
.act.on.save svg{fill:var(--porch)}

/* listing info */
.info{position:absolute;left:14px;right:74px;bottom:16px;z-index:3;display:flex;flex-direction:column;gap:6px;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-shadow:none}
.chip.new,.chip.unless,.chip.open{color:var(--porch)}
.chip.drop{color:var(--heart)}
.chip.fsbo,.chip.ver{color:var(--match)}
.chip.live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--heart);margin-right:5px;vertical-align:1px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.kicker{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--porch);margin-bottom:-4px}
.price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price{font-family:var(--display);font-size:34px;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.was{font-size:14px;color:var(--muted);text-decoration:line-through}
.mo{font-size:14px;font-weight:700;color:var(--porch)}
.facts{font-size:14px;font-weight:600}
.addr{font-size:13px;color:var(--muted);font-weight:500}
.cap{margin:0;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.agent{display:flex;align-items:center;gap:8px;font-size:13px}
.agent .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--raise);border:1.5px solid var(--text);flex:none;text-shadow:none}
.agent b{font-weight:700}
.agent em{font-style:normal;color:var(--match);font-weight:700}
.agent small{display:block;color:var(--muted);font-size:11.5px}
.agent>div{min-width:0}
.follow{margin-left:auto;font-size:12px;font-weight:800;padding:5px 11px;border-radius:99px;border:1.5px solid var(--text);text-shadow:none;flex:none}
.follow.on{background:var(--text);color:var(--ink)}
.ctas{display:flex;gap:6px;margin-top:2px}
.cta{flex:1;font-size:13px;font-weight:800;padding:10px 8px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-shadow:none}
.cta.primary{background:var(--porch);color:var(--porch-ink);border-color:transparent}

.guess{padding:10px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;gap:8px;text-shadow:none}
.g-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.g-top output{font-family:var(--display);font-size:22px;letter-spacing:0;text-transform:none;color:var(--text);font-variant-numeric:tabular-nums}
.guess input{width:100%;accent-color:var(--porch)}
.g-result{font-size:13px;font-weight:600;color:var(--muted)}
.g-result b{color:var(--porch)}

.burst{position:absolute;left:50%;top:45%;width:110px;height:110px;margin:-55px 0 0 -55px;z-index:4;pointer-events:none;opacity:0}
.burst svg{width:100%;height:100%;fill:var(--heart);filter:drop-shadow(0 6px 20px rgba(0,0,0,.4))}
.burst.go{animation:burst .7s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.4) rotate(-12deg)}25%{opacity:1;transform:scale(1.1) rotate(-8deg)}60%{opacity:1;transform:scale(1) rotate(-8deg)}100%{opacity:0;transform:scale(1.25) translateY(-40px) rotate(-8deg)}}

/* other views */
.view{position:absolute;inset:0 0 64px 0;overflow-y:auto;background:var(--night);padding:20px 18px 28px;display:flex;flex-direction:column;gap:16px}
.v-head h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;text-wrap:balance}
.v-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px;line-height:1.4}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 7px;vertical-align:3px;margin-left:6px;font-family:var(--body)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--raise);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.panel{background:var(--raise);border-radius:14px;padding:14px;display:grid;gap:10px}
.panel h2{margin:0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sp{width:100%;height:auto;display:block}
.sp-area{fill:var(--porch);opacity:.16}
.sp-line{fill:none;stroke:var(--porch);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.sp-dot{fill:var(--porch)}
.sp-grid{stroke:var(--line);stroke-width:1}
.sp-lab{fill:var(--muted);font-size:11px;font-family:var(--body)}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;align-items:center}
.bar i{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--porch);border-radius:3px}
.bar span:last-of-type{font-variant-numeric:tabular-nums;font-weight:700}
.ask{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
.ask:first-of-type{border-top:0}
.ask span{color:var(--muted);font-variant-numeric:tabular-nums}
.callout{font-size:14px;line-height:1.4}
.callout b{color:var(--porch)}
.btn{font-size:14px;font-weight:800;padding:13px;border-radius:14px;background:var(--porch);color:var(--porch-ink);text-align:center}
.btn.ghost{background:var(--raise);color:var(--text)}

.mlist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;background:var(--raise);border-radius:14px;padding:8px;text-align:left}
.mrow .thumb{width:76px;height:96px;border-radius:10px;overflow:hidden}
.mrow .thumb svg{width:100%;height:100%;display:block}
.mrow b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.mrow span{font-size:12.5px;color:var(--muted);display:block;line-height:1.4}
.mrow em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--match)}
.empty{color:var(--muted);font-size:14px;line-height:1.5;background:var(--raise);border-radius:14px;padding:18px}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:64px;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);position:relative}
.nav button[aria-current="page"]{color:var(--text)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.nav .plus span{width:44px;height:30px;border-radius:10px;background:var(--porch);display:grid;place-items:center}
.nav .plus svg{stroke:var(--porch-ink);stroke-width:2.6}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--match);color:#06281e;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* sheets, modal, toast */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(0,0,0,.45)}
.sheet{width:100%;max-height:78%;overflow-y:auto;background:var(--night);border-radius:22px 22px 0 0;padding:10px 18px 22px;display:grid;gap:12px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.sheet h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.sheet p.sub{margin:-6px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.cmt{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:13.5px;line-height:1.4}
.cmt .av{width:30px;height:30px;border-radius:50%;background:var(--raise);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted)}
.cmt b{font-size:12.5px;color:var(--muted);font-weight:700}
.cmt .badge2{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:99px;margin-left:5px;background:var(--porch);color:var(--porch-ink)}
.cmt .badge2.seller{background:var(--match);color:#06281e}
.compose{display:flex;gap:8px;position:sticky;bottom:-22px;background:var(--night);padding-block:8px}
.compose input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--text);background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.compose button{font-weight:800;color:var(--porch);padding:0 6px}
.rows{display:grid;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--raise);font-size:14px;font-weight:600;text-align:left}
.row span{color:var(--muted);font-weight:500;font-size:12.5px}
.pay{display:grid;gap:0;font-size:14px}
.pay div{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.pay div:first-child{border-top:0}
.pay div.total{font-weight:800;font-size:16px;color:var(--porch)}
.clips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.clip{aspect-ratio:9/14;max-width:100%;border-radius:10px;overflow:hidden;position:relative}
.clip svg{width:100%;height:100%;display:block}
.clip span{position:absolute;left:5px;bottom:5px;font-size:10px;font-weight:700;background:var(--glass);padding:2px 5px;border-radius:5px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.sw small{display:block;color:var(--muted);font-size:12px}
.sw input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text);transition:transform .15s}
.sw input:checked{background:var(--porch)}
.sw input:checked::after{transform:translateX(18px)}

.match{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(8,20,16,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-align:center}
.match-in{display:grid;gap:14px;justify-items:center;animation:up .3s ease-out}
.pair{display:flex}
.pair span{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;border:3px solid var(--match);background:var(--raise)}
.pair span+span{margin-left:-14px;background:var(--match);color:#06281e}
.match h2{font-family:var(--display);font-weight:400;font-size:38px;margin:0;color:var(--match)}
.match p{margin:0;font-size:15px;line-height:1.45;max-width:30ch}
.match .btns{display:grid;gap:8px;width:100%;max-width:260px}
.match .btn{background:var(--match);color:#06281e}

.toast{position:absolute;left:50%;top:100px;transform:translateX(-50%);z-index:40;max-width:calc(100% - 32px);width:max-content;font-size:13px;font-weight:700;padding:10px 14px;border-radius:12px;background:var(--text);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .2s ease-out;text-align:center}

@media (prefers-reduced-motion:reduce){
  .card.active .media svg,.segs i.on b,.burst.go,.chip.live i,.sheet,.match-in,.toast,.quote{animation:none}
  .segs i.on b{width:100%}
}
</style>

<div class="phone" id="app">
  <header class="top" id="top">
    <div class="mark"><span class="moon" aria-hidden="true"></span>dreamscrol<small>Demo</small></div>
    <div class="toggles">
      <button class="tog" id="tGuess" aria-pressed="false">Guess</button>
      <button class="tog cpl" id="tCouples" aria-pressed="false">Couples</button>
    </div>
  </header>

  <main class="feed" id="feed" aria-label="Listings feed"></main>

  <section class="view" id="vMatches" hidden aria-label="Matches"></section>
  <section class="view" id="vReport" hidden aria-label="Seller report"></section>

  <nav class="nav" aria-label="Main">
    <button data-view="feed" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg>Feed</button>
    <button data-view="matches"><svg viewBox="0 0 24 24"><path d="M12 20s-6.5-4-8.3-8C2.4 9 4.2 5.5 7.4 5.5c1.9 0 3.2 1 4.6 2.6 1.4-1.6 2.7-2.6 4.6-2.6 3.2 0 5 3.5 3.7 6.5-1.8 4-8.3 8-8.3 8z"/></svg>Matches<span class="badge" id="badge" hidden>0</span></button>
    <button class="plus" data-open="post" aria-label="Post a listing"><span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Post</button>
    <button data-view="report"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/></svg>Report</button>
  </nav>

  <div id="layer"></div>
</div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const fmtK=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e4?(n/1e3).toFixed(1).replace(/\.0$/,'')+'K':n.toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RATE=.065, DOWN=.2, TAX=.019, INS=180;
function pay(p){const P=p*(1-DOWN),r=RATE/12,n=360;const pi=P*r/(1-Math.pow(1+r,-n));const tax=p*TAX/12;return{pi,tax,ins:INS,total:Math.round((pi+tax+INS)/10)*10}}
const PARTNER='Sam';

/* Sample listings. Every address, agent and price here is made up. */
const L=[
 {style:'modern',price:749000,beds:3,baths:2.5,sqft:2140,addr:'1407 Haskell St',hood:'East Austin',
  agent:{h:'mariasellsatx',b:'Lone Oak Realty',i:'MO'},chips:[{t:'New · 2h ago',k:'new'}],watching:312,likes:18400,cc:842,saves:1206,shares:2914,
  cap:'Floor-to-ceiling glass and a kitchen built for hosting.',rooms:['Exterior','Kitchen','Living','Primary suite'],partner:true,
  sky:['#1b2050','#f0956a'],orb:[300,250,26],orbC:'#ffe2b8',hill:'#2e2a3a',ground:'#23222a',wall:['#efe6da','#d7c9b6'],floor:'#9a7656',trim:'#2a2a2e',sofa:'#4b5d73'},
 {style:'aframe',price:485000,beds:2,baths:1,sqft:1060,addr:'88 Cedar Hollow Rd',hood:'Dripping Springs',

function setRoom(i,ri){

function play(i){
 clearInterval(timer);
 $$('.card.active').forEach(c=>c.classList.remove('active'));

}

 const on=forceOn?true:!S.liked.has(i);
 if(on===S.liked.has(i))return;
 on?S.liked.add(i):S.liked.delete(i);updateRail(i);
 if(on&&S.couples&&L[i].partner&&!S.matches.includes(i)){S.matches.push(i);badge();setTimeout(()=>showMatch(i),350)}
}
function burst(c){const b=$('.burst',c);b.classList.remove('go');void b.offsetWidth;b.classList.add('go')}

function showMatch(i){
 const l=L[i];
 layer.insertAdjacentHTML('beforeend',`<div class="match" role="dialog" aria-modal="true" aria-label="It's a match"><div class="match-in">
  <div class="pair"><span>You</span><span>${PARTNER[0]}</span></div>
  <h2>It’s a match</h2>
  <p>You and ${PARTNER} both want <b>${esc(l.addr)}</b> in ${esc(l.hood)}.</p>
  <div class="btns"><button class="btn" data-m="tour">Book a tour together</button><button class="btn ghost" data-m="close">Keep scrolling</button></div>
 </div></div>`);
}

function sheet(html){closeSheet();layer.insertAdjacentHTML('beforeend',`<div class="sheet-wrap" data-close><div class="sheet" role="dialog" aria-modal="true"><div class="handle"></div>${html}</div></div>`);const f=layer.querySelector('.sheet button, .sheet input');f&&f.focus({preventScroll:true})}
function closeSheet(){layer.querySelectorAll('.sheet-wrap,.match').forEach(n=>n.remove())}

function commentsSheet(i){
 const rows=C[i].map(([h,t,k])=>`<div class="cmt"><span class="av">${esc(h.slice(0,2).toUpperCase())}</span><div><b>@${esc(h)}</b>${k?`<span class="badge2 ${k==='seller'?'seller':''}">${k==='agent'?'Listing agent':'Seller'}</span>`:''}<div>${esc(t)}</div></div></div>`).join('');
 sheet(`<h3>${fmtK(L[i].cc+C[i].length)} comments</h3><div class="rows" style="gap:14px">${rows}</div>
  <form class="compose" data-form="${i}"><input id="cIn" autocomplete="off" placeholder="Ask about this home…" aria-label="Add a comment"><button type="submit">Post</button></form>`);
}
function shareSheet(i){
 const l=L[i];
 sheet(`<h3>Share this home</h3><p class="sub">${esc(l.addr)} · ${money(l.price)}</p><div class="rows">
  <button class="row" data-share="partner">Send to ${PARTNER}<span>Your house-hunting partner</span></button>
  <button class="row" data-share="copy" data-i="${i}">Copy link<span>dreamscrol.app/h/${i+1}</span></button>
  <button class="row" data-share="tiktok">Repost to TikTok<span>Adds the Dreamscrol watermark</span></button>
  <button class="row" data-share="reels">Repost to Reels<span>Adds the Dreamscrol watermark</span></button></div>`);
}
function affordSheet(i){
 const l=L[i],p=pay(l.price);
 sheet(`<h3>Can I afford it?</h3><p class="sub">Estimate for ${esc(l.addr)} at ${(RATE*100).toFixed(1)}% fixed, 30 years, ${DOWN*100}% down.</p>
  <div class="pay"><div><span>Price</span><span>${money(l.price)}</span></div><div><span>Down payment</span><span>${money(l.price*DOWN)}</span></div>
  <div><span>Principal and interest</span><span>${money(p.pi)}</span></div><div><span>Property tax (est.)</span><span>${money(p.tax)}</span></div>
  <div><span>Home insurance (est.)</span><span>${money(p.ins)}</span></div><div class="total"><span>Monthly</span><span>${money(p.total)}</span></div></div>
  <button class="btn" data-pre>Get pre-approved in 3 minutes</button>`);
}
function postSheet(){
 const demo=L[0];
 const clips=['Exterior','Kitchen','Living','Primary suite','Backyard','Exterior'].map((r,k)=>{const l=k===4?L[1]:demo;const ri=l.rooms.indexOf(r);return `<div class="clip">${scene(l,ri<0?0:ri)}<span>IMG_20${41+k}.mov · 0:${String(9+k*3).padStart(2,'0')}</span></div>`}).join('');
 const sw=(id,t,s,on=true)=>`<label class="sw" for="${id}"><span>${t}<small>${s}</small></span><input type="checkbox" id="${id}"${on?' checked':''}></label>`;
 sheet(`<h3>Post a listing</h3><p class="sub">Drop raw phone clips. We cut the video in about 60 seconds.</p>
  <div class="clips">${clips}</div>
  <div>${sw('o1','Open on the best shot','AI picks the hook for the first 2 seconds')}${sw('o2','Captions and room labels','Auto-generated, editable')}
  ${sw('o3','Price and monthly payment overlay','Pulled from the listing')}${sw('o4','Licensed trending music','Cleared for TikTok and Reels')}
  ${sw('o5','Cross-post to TikTok and Reels','With the Dreamscrol watermark')}${sw('o6','Invite sellers to collab','They can add a “From the sellers” clip after you approve it',false)}</div>
  <button class="btn" data-publish>Publish</button>`);
}

$('#app').addEventListener('click',e=>{
 const t=e.target;
 if(t.matches('[data-close]')){closeSheet();return}
 const m=t.closest('[data-m]');
 if(m){closeSheet();if(m.dataset.m==='tour')toast(`Tour request sent for you and ${PARTNER} (demo)`);return}
 const sh=t.closest('[data-share]');
 if(sh){const k=sh.dataset.share;
  if(k==='copy'){const url='dreamscrol.app/h/'+(+sh.dataset.i+1);
   const done=()=>{closeSheet();toast('Link copied')},fail=()=>{const r=document.createRange();r.selectNodeContents($('span',sh));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Link selected. Press copy to share it.')};
   try{navigator.clipboard.writeText(url).then(done,fail)}catch(_){fail()}return}
  closeSheet();toast(k==='partner'?`Sent to ${PARTNER}`:`Reposted with watermark (demo)`);return}
 if(t.closest('[data-pre]')){closeSheet();toast('Pre-approval would start here (demo)');return}
 if(t.closest('[data-publish]')){closeSheet();toast('Published. 1,200 nearby buyers see it first (demo)');return}
 if(t.closest('[data-open=post]')){postSheet();return}
 const v=t.closest('[data-view]'); if(v){go(v.dataset.view);return}
 const mr=t.closest('[data-goto]'); if(mr){go('feed');card(+mr.dataset.goto).scrollIntoView({behavior:'smooth'});return}
 if(t.closest('[data-send-report]')){toast('Report sent to the sellers (demo)');return}

 const a=t.closest('[data-act]'); if(!a)return;
 const c=a.closest('.card'),i=c?+c.dataset.i:-1,act=a.dataset.act;
 if(act==='like')like(i);
 else if(act==='save'){S.saved.has(i)?S.saved.delete(i):S.saved.add(i);updateRail(i);if(S.saved.has(i))toast('Saved. We’ll tell you if the price changes.')}
 else if(act==='comments')commentsSheet(i);
 else if(act==='share')shareSheet(i);
 else if(act==='afford')affordSheet(i);
 else if(act==='follow'){const h=L[i].agent.h,on=!S.follow.has(h);on?S.follow.add(h):S.follow.delete(h);a.classList.toggle('on',on);a.textContent=on?'Following':'Follow'}
 else if(act==='tour')toast(L[i].offmarket?'Interest sent to the homeowners (demo)':L[i].fsbo?'Message sent to the owners (demo)':'Tour request sent to the listing agent (demo)');
 else if(act==='lock'){
  const p=L[i].price,g=+$('#gr'+i).value,acc=Math.max(0,1-Math.abs(g-p)/p),pts=Math.round(acc*100);
  S.guesses[i]={g,acc,pts};S.score+=pts;renderPrice(i);header();
  toast(acc>.95?`Nailed it. +${pts} pts`:acc>.85?`Close. +${pts} pts`:`Off by ${money(Math.abs(g-p))}. +${pts} pts`);
 }
});
$('#app').addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,i=+f.dataset.form,inp=$('#cIn',f),v=inp.value.trim();if(!v)return;
 C[i].push(['you',v]);updateRail(i);commentsSheet(i);
 const list=layer.querySelector('.sheet');list.scrollTop=list.scrollHeight;
});
feed.addEventListener('input',e=>{if(e.target.type==='range'){const i=e.target.id.slice(2);$('#go'+i).textContent=money(+e.target.value)}});

let lastTap=0,lastCard=null;
feed.addEventListener('pointerup',e=>{
 if(e.target.closest('button,input,label,output,.guess'))return;
 const c=e.target.closest('.card');if(!c)return;
 const now=Date.now();
 if(now-lastTap<320&&lastCard===c){like(+c.dataset.i,true);burst(c);lastTap=0}else{lastTap=now;lastCard=c}
});

/* toggles */
function header(){
 const g=$('#tGuess'),cp=$('#tCouples');
 g.setAttribute('aria-pressed',S.guess);g.textContent=S.guess?`${S.score} pts`:'Guess';
 cp.setAttribute('aria-pressed',S.couples);cp.textContent=S.couples?`+ ${PARTNER}`:'Couples';
}
$('#tGuess').addEventListener('click',()=>{S.guess=!S.guess;L.forEach((_,i)=>renderPrice(i));header();if(S.guess)toast('Prices are hidden. Guess before you see them.')});
$('#tCouples').addEventListener('click',()=>{
 S.couples=!S.couples;header();
 if(S.couples){S.liked.forEach(i=>{if(L[i].partner&&!S.matches.includes(i))S.matches.push(i)});badge();toast(`Couples on. When you and ${PARTNER} like the same home, it’s a match.`)}
});

/* views */
function go(v){
 S.view=v;
 $$('.nav [data-view]').forEach(b=>{if(b.dataset.view===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 const isFeed=v==='feed';
 feed.hidden=!isFeed;$('#top').hidden=!isFeed;
 $('#vMatches').hidden=v!=='matches';$('#vReport').hidden=v!=='report';
 if(v==='matches')renderMatches();
 if(isFeed&&S.active>=0)play(S.active);else clearInterval(timer);
}
function renderMatches(){
 const el=$('#vMatches');
 const head=`<div class="v-head"><h1>Matches</h1><p>Homes you and ${PARTNER} both liked. Couples mode has to be on.</p></div>`;
 if(!S.matches.length){el.innerHTML=head+`<div class="empty">No matches yet. Turn on <b>Couples</b> at the top of the feed, then like homes. When ${PARTNER} has liked the same one, it shows up here. In this demo, ${PARTNER} has liked three of the six.</div>`;return}
 el.innerHTML=head+`<div class="mlist">${S.matches.map(i=>{const l=L[i];return `<button class="mrow" data-goto="${i}"><span class="thumb">${scene(l,0)}</span><span><em>You + ${PARTNER}</em><b>${money(l.price)}</b><span>${esc(l.addr)} · ${esc(l.hood)}</span><span>${l.beds} bd · ${l.baths} ba · ≈ ${money(pay(l.price).total)}/mo</span></span></button>`}).join('')}</div>`;
}
function renderReport(){
 const d=[3100,5400,6200,7900,8800,7600,9200],days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 const x=k=>34+k*(296/6),y=v=>124-v/10000*104;
 const pts=d.map((v,k)=>`${x(k).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
 const grid=[0,5000,10000].map(v=>`<line class="sp-grid" x1="34" x2="330" y1="${y(v)}" y2="${y(v)}"/><text class="sp-lab" x="0" y="${y(v)+4}">${v?v/1000+'K':'0'}</text>`).join('');
 const labs=days.map((t,k)=>`<text class="sp-lab" x="${x(k)}" y="146" text-anchor="middle">${t}</text>`).join('');
 const spark=`<svg class="sp" viewBox="0 0 340 152" role="img" aria-label="Daily views over 7 days, rising from 3.1K to 9.2K">${grid}<polygon class="sp-area" points="${x(0)},124 ${pts} ${x(6)},124"/><polyline class="sp-line" points="${pts}"/><circle class="sp-dot" cx="${x(6)}" cy="${y(9200)}" r="4.5"/>${labs}</svg>`;
 const bar=(t,p)=>`<div class="bar"><span>${t}</span><span>${p}%</span><i><b style="width:${p}%"></b></i></div>`;
 $('#vReport').innerHTML=`<div class="v-head"><h1>Seller report<span class="tag">Sample data</span></h1><p>1407 Haskell St · live 7 days. Agents bring this to listing pitches.</p></div>
  <div class="stats"><div class="stat"><b>48.2K</b><span>Views</span></div><div class="stat"><b>1,206</b><span>Saves</span></div><div class="stat"><b>37</b><span>Tour requests</span></div><div class="stat"><b>2,914</b><span>Shares</span></div></div>
  <div class="panel"><h2>Views per day</h2>${spark}</div>
  <div class="panel"><p class="callout">This home got <b>3.4× more views</b> than the median East Austin listing this week.</p></div>
  <div class="panel"><h2>Where viewers came from</h2>${bar('For You feed',71)}${bar('Shared by the sellers',18)}${bar('TikTok and Reels reposts',11)}</div>
  <div class="panel"><h2>Buyers keep asking</h2><div class="ask">Is the garage EV-ready?<span>12 asked</span></div><div class="ask">Is there an HOA?<span>9 asked</span></div><div class="ask">Which schools is it zoned for?<span>7 asked</span></div></div>
  <button class="btn" data-send-report>Send report to the sellers</button>`;
}
renderReport();

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeSheet();return}
 if(S.view!=='feed'||layer.querySelector('.sheet-wrap,.match')||/INPUT/.test(document.activeElement.tagName))return;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=Math.max(0,Math.min(L.length-1,S.active+(e.key==='ArrowDown'?1:-1)));card(n).scrollIntoView({behavior:'smooth'})}
});

play(0);
setTimeout(()=>toast('Swipe up for the next home. Double-tap to like.'),600);
})();
</script>
