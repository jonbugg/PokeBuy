<title>Dreamscrol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Young+Serif&display=swap">
<style>
/* Layout: one phone-shaped frame; a full-height snap feed of listing "videos" with overlays floating on top; other tabs are dark panels. Single dark look, like any video feed. */
:root{
  --ink:#0f0d13;      /* page ground */
  --night:#1a1720;    /* panels and sheets */
  --raise:#252130;    /* raised rows */
  --raise2:#302b3c;
  --line:rgba(255,255,255,.13);
  --glass:rgba(16,14,20,.56);
  --text:#f7f3ee;
  --muted:#b3acbc;
  --porch:#ffc46b;    /* accent: porch light */
  --porch-ink:#2a1d07;
  --heart:#ff5c7c;
  --match:#7fe3c4;
  --match-ink:#06281e;
  --live:#ff3b5c;
  --black:#000;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);display:grid;place-items:center;overflow:hidden;
  padding-block:12px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid var(--porch);outline-offset:2px;border-radius:8px}

.phone{position:relative;width:min(100%,420px);height:100%;max-height:880px;border-radius:28px;overflow:hidden;overflow:clip;background:var(--black);
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px var(--line)}

/* top bar */
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 0}
.mark{min-width:0;font-family:var(--display);font-size:23px;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.mark .moon{width:14px;height:14px;border-radius:50%;box-shadow:inset -4px -1px 0 0 var(--porch);transform:rotate(-20deg);flex:none}
.mark small{font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 6px;margin-left:2px}
.toggles{display:flex;gap:6px;flex:none}
.tog{font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.tog[aria-pressed="true"]{background:var(--porch);color:var(--porch-ink);border-color:transparent}
.tog.cpl[aria-pressed="true"]{background:var(--match);color:var(--match-ink)}

/* feed */
.feed{position:absolute;inset:0 0 64px 0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.media{position:absolute;inset:0}
.media svg{width:100%;height:100%;display:block;transform-origin:50% 62%;transform:scale(1.04)}
.card.active .media svg{animation:kb 3.6s ease-out forwards,fadein .45s ease-out}
.card.live.active .media svg{animation:sway 3.6s ease-in-out forwards,fadein .45s ease-out}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.15) translateY(-1.5%)}}
@keyframes sway{0%{transform:scale(1.1) translateX(-2%)}50%{transform:scale(1.12) translate(1%,-.5%)}100%{transform:scale(1.1) translateX(2%)}}
@keyframes fadein{from{opacity:.25}to{opacity:1}}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 20%,transparent 38%,rgba(0,0,0,.9) 86%)}

.card.promo{display:grid;align-content:center;padding:28px 24px 40px;background:radial-gradient(120% 70% at 85% 8%,#3b2b57 0%,transparent 60%),radial-gradient(100% 60% at 0% 100%,#4d3118 0%,transparent 60%),var(--night)}
.promo .eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--porch);margin-bottom:10px}
.promo h2{font-family:var(--display);font-weight:400;font-size:36px;line-height:1.1;margin:0 0 12px;text-wrap:balance}
.promo p{color:var(--muted);font-size:15px;line-height:1.45;margin:0 0 18px;max-width:32ch}
.promo ul{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:10px;font-size:14.5px}
.promo li{display:flex;gap:10px;align-items:baseline}
.promo li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--porch);transform:translateY(-1px)}
.promo .btn{justify-self:start;padding:14px 20px}
.promo .done{font-family:var(--display);font-size:22px;color:var(--match)}

.segs{position:absolute;top:56px;left:14px;right:14px;display:flex;gap:4px;z-index:2}
.segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.segs b{display:block;height:100%;width:0;background:var(--text)}
.segs i.done b{width:100%}
.segs i.on b{animation:fill 3.5s linear forwards}
@keyframes fill{to{width:100%}}
.room{position:absolute;top:68px;left:14px;z-index:2;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.liveflag{position:absolute;top:64px;left:14px;z-index:2;display:flex;gap:6px;align-items:center}
.liveflag b{font-size:11px;font-weight:800;letter-spacing:.08em;padding:4px 8px;border-radius:6px;background:var(--live)}
.liveflag span{font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.quote{position:absolute;left:22px;right:84px;top:28%;z-index:2;font-family:var(--display);font-size:22px;line-height:1.25;text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.7);animation:fadein .6s ease-out}
.quote span{display:block;margin-top:8px;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--porch)}

/* right rail */
.rail{position:absolute;right:8px;bottom:22px;z-index:3;display:flex;flex-direction:column;gap:14px;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;min-width:52px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.act svg{width:32px;height:32px;fill:var(--text);filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));transition:transform .15s}
.act:active svg{transform:scale(.88)}
.act.on.like svg{fill:var(--heart)}
.act.on.save svg{fill:var(--porch)}
.fh{position:absolute;right:22px;bottom:240px;width:26px;height:26px;z-index:3;pointer-events:none;animation:floatup 1.8s ease-out forwards}
.fh svg{width:100%;height:100%;fill:var(--heart)}
@keyframes floatup{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx,-20px),-220px) scale(1.1)}}

/* listing info */
.info{position:absolute;left:14px;right:74px;bottom:16px;z-index:3;display:flex;flex-direction:column;gap:6px;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-shadow:none}
.chip.new,.chip.unless,.chip.open,.chip.north{color:var(--porch)}
.chip.drop{color:var(--heart)}
.chip.fsbo,.chip.ver,.chip.reno{color:var(--match)}
.chip.fit{background:var(--match);color:var(--match-ink);border-color:transparent}
.chip.stretch{background:var(--porch);color:var(--porch-ink);border-color:transparent}
.chip.over{color:var(--muted)}
.chip.live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--heart);margin-right:5px;vertical-align:1px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.tapinfo{display:flex;flex-direction:column;gap:5px;cursor:pointer;border-radius:10px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--porch);margin-bottom:-3px}
.price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price{font-family:var(--display);font-size:34px;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.was{font-size:14px;color:var(--muted);text-decoration:line-through}
.mo{font-size:14px;font-weight:700;color:var(--porch)}
.facts{font-size:14px;font-weight:600}
.addr{font-size:13px;color:var(--muted);font-weight:500}
.addr u{text-decoration:none;color:var(--text);font-weight:700;margin-left:4px}
.cap{margin:0;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.agent{display:flex;align-items:center;gap:8px;font-size:13px}
.agent .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--raise);border:1.5px solid var(--text);flex:none;text-shadow:none}
.agent b{font-weight:700}
.agent em{font-style:normal;color:var(--match);font-weight:700}
.agent small{display:block;color:var(--muted);font-size:11.5px}
.agent .brk{display:block;font-size:13px;font-weight:700;color:var(--text)}
.agent .brk i{font-style:normal;font-weight:500;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;min-width:0;text-align:left}
.who>span:last-child{min-width:0}
.follow{margin-left:auto;font-size:12px;font-weight:800;padding:5px 11px;border-radius:99px;border:1.5px solid var(--text);text-shadow:none;flex:none}
.follow.on{background:var(--text);color:var(--ink)}
.ctas{display:flex;gap:6px;margin-top:2px}
.cta{flex:1;font-size:13px;font-weight:800;padding:10px 6px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-shadow:none;white-space:nowrap}
.cta.primary{background:var(--porch);color:var(--porch-ink);border-color:transparent}

.chat{display:flex;flex-direction:column;gap:5px;margin-bottom:4px;max-height:150px;overflow:hidden;justify-content:flex-end;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%);mask-image:linear-gradient(to bottom,transparent,#000 30%)}
.chat p{margin:0;font-size:13px;line-height:1.3;animation:fadein .35s ease-out}
.chat p b{color:var(--muted);font-weight:700;margin-right:5px}
.chat p.host b{color:var(--porch)}
.chat p.you b{color:var(--match)}
.askrow{display:flex;gap:6px}
.askrow input{flex:1;min-width:0;font:inherit;font-size:13.5px;color:var(--text);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.askrow button{font-size:13px;font-weight:800;padding:0 14px;border-radius:12px;background:var(--porch);color:var(--porch-ink)}

.guess{padding:10px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;gap:8px;text-shadow:none}
.g-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.g-top output{font-family:var(--display);font-size:22px;letter-spacing:0;text-transform:none;color:var(--text);font-variant-numeric:tabular-nums}
.guess input{width:100%;accent-color:var(--porch)}
.g-result{font-size:13px;font-weight:600;color:var(--muted)}
.g-result b{color:var(--porch)}

.burst{position:absolute;left:50%;top:45%;width:110px;height:110px;margin:-55px 0 0 -55px;z-index:4;pointer-events:none;opacity:0}
.burst svg{width:100%;height:100%;fill:var(--heart);filter:drop-shadow(0 6px 20px rgba(0,0,0,.4))}
.burst.go{animation:burst .7s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.4) rotate(-12deg)}25%{opacity:1;transform:scale(1.1) rotate(-8deg)}60%{opacity:1;transform:scale(1) rotate(-8deg)}100%{opacity:0;transform:scale(1.25) translateY(-40px) rotate(-8deg)}}

/* other views */
.view{position:absolute;inset:0 0 64px 0;overflow-y:auto;background:var(--night);padding:20px 18px 28px;display:flex;flex-direction:column;gap:16px}
.v-head h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;text-wrap:balance}
.v-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px;line-height:1.4}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 7px;vertical-align:3px;margin-left:6px;font-family:var(--body)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--raise);border-radius:14px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.stats.three .stat b{font-size:22px}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.panel{background:var(--raise);border-radius:14px;padding:14px;display:grid;gap:10px}
.panel h2{margin:0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel .big{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding-top:8px;border-top:1px solid var(--line)}
.kv span{color:var(--muted)}
.kv b{font-weight:700;text-align:right}
.sp{width:100%;height:auto;display:block}
.sp-area{fill:var(--porch);opacity:.16}
.sp-line{fill:none;stroke:var(--porch);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.sp-dot{fill:var(--porch)}
.sp-grid{stroke:var(--line);stroke-width:1}
.sp-lab{fill:var(--muted);font-size:11px;font-family:var(--body)}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;align-items:center}
.bar i{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--porch);border-radius:3px}
.bar span:last-of-type{font-variant-numeric:tabular-nums;font-weight:700}
.ask{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
.ask:first-of-type{border-top:0}
.ask span{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.callout{font-size:14px;line-height:1.4;margin:0}
.callout b{color:var(--porch)}
.btn{font-size:14px;font-weight:800;padding:13px;border-radius:14px;background:var(--porch);color:var(--porch-ink);text-align:center}
.btn.ghost{background:var(--raise);color:var(--text)}
.btn.mint{background:var(--match);color:var(--match-ink)}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--raise);border-radius:12px;padding:3px}
.seg button{font-size:13px;font-weight:800;padding:9px;border-radius:9px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise2);color:var(--text)}
.me-head{display:flex;gap:12px;align-items:center}
.me-head .big{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--raise2);border:2px solid var(--porch);flex:none}
.me-head h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.me-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.taste{display:flex;flex-wrap:wrap;gap:6px}
.taste span{font-size:13px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--raise2)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:10px;overflow:hidden;text-align:left}
.tile svg{width:100%;height:100%;display:block}
.tile span{position:absolute;left:5px;right:5px;bottom:5px;font-size:11px;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.tile.sold::after{content:"Sold";position:absolute;top:6px;left:6px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--text);color:var(--ink);padding:2px 6px;border-radius:5px}
.muted{color:var(--muted);font-size:13.5px;line-height:1.45;margin:0}
.lb{display:grid;grid-template-columns:22px 34px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.lb:first-of-type{border-top:0}
.lb .n{font-family:var(--display);color:var(--muted);font-size:16px;text-align:center}
.lb .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--raise2)}
.lb small{display:block;color:var(--muted);font-size:11.5px}
.lb .v{font-weight:800;font-variant-numeric:tabular-nums}
.lb.me{background:rgba(255,196,107,.08);border-radius:10px;padding-inline:6px;border-top-color:transparent}

.mlist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;background:var(--raise);border-radius:14px;padding:8px;text-align:left}
.mrow .thumb{width:76px;height:96px;border-radius:10px;overflow:hidden}
.mrow .thumb svg{width:100%;height:100%;display:block}
.mrow b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.mrow span{font-size:12.5px;color:var(--muted);display:block;line-height:1.4}
.mrow em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--match)}
.empty{color:var(--muted);font-size:14px;line-height:1.5;background:var(--raise);border-radius:14px;padding:18px}

.inbox{display:grid;gap:2px}
.note{display:grid;grid-template-columns:40px 1fr 10px;gap:12px;align-items:center;padding:12px 8px;border-radius:12px;text-align:left}
.note:hover{background:var(--raise)}
.note .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--raise2)}
.note .ic svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note .ic.sold,.note .ic.offer{background:var(--porch)} .note .ic.sold svg,.note .ic.offer svg{stroke:var(--porch-ink)}
.note .ic.drop{background:rgba(255,92,124,.18)} .note .ic.drop svg{stroke:var(--heart)}
.note .ic.heart,.note .ic.bank{background:rgba(127,227,196,.16)} .note .ic.heart svg,.note .ic.bank svg{stroke:var(--match)}
.note .ic.live{background:var(--live)}
.note b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.note span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.note i{width:8px;height:8px;border-radius:50%;background:var(--porch)}
.note i.read{background:transparent}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:64px;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--ink);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);position:relative}
.nav button[aria-current="page"]{color:var(--text)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.nav .plus span{width:44px;height:30px;border-radius:10px;background:var(--porch);display:grid;place-items:center}
.nav .plus svg{stroke:var(--porch-ink);stroke-width:2.6}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--match);color:var(--match-ink);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.badge.hot{background:var(--porch);color:var(--porch-ink)}

/* sheets, modal, toast */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(0,0,0,.45)}
.sheet{width:100%;max-height:86%;overflow-y:auto;background:var(--night);border-radius:22px 22px 0 0;padding:10px 18px 22px;display:grid;gap:12px;animation:up .25s ease-out}

/* ---------- money math ---------- */
const rateNow=()=>S.lender?S.lender.rate:S.bp?BASE_RATE+CREDIT[S.bp.credit]:BASE_RATE;
function pay(p,taxRate,opts={}){
 const rate=(opts.rate??rateNow())/100,down=Math.min(p,opts.down??(S.bp?S.bp.down:p*DOWN));
 const P=Math.max(0,p-down),r=rate/12,n=360,pi=P>0?P*r/(1-Math.pow(1+r,-n)):0,tax=p*taxRate/12;
 return{pi,tax,ins:INS,down,rate:rate*100,loan:P,total:Math.round((pi+tax+INS)/10)*10};
}
function buyingPower(b){
 const mi=b.income/12,cap=Math.max(0,Math.min(mi*.28,mi*.43-b.debts)),rate=BASE_RATE+CREDIT[b.credit];
 let lo=0,hi=3e6;for(let k=0;k<40;k++){const mid=(lo+hi)/2;if(pay(mid,.022,{rate,down:b.down}).total<=cap)lo=mid;else hi=mid}
 return{max:Math.floor(lo/5000)*5000,cap:Math.round(cap/10)*10,rate};
}
function fit(l){if(!S.bp||l.offmarket)return null;const m=S.bp.max;return l.price<=m*.9?['fit','In your budget']:l.price<=m*1.05?['stretch','A stretch']:['over','Over budget']}

let timer=null,liveT=null,heartT=null,watchT=null;
function setRoom(i,ri){

 $('#rp'+i).textContent=(l.live?'Touring: ':'')+l.rooms[ri];

 segs.forEach((s,k)=>{s.classList.remove('on');s.classList.toggle('done',k<ri)});
 void segs[ri].offsetWidth; segs[ri].classList.add('on');
}

 stopPlayback();
 $$('.card.active').forEach(c=>c.classList.remove('active'));
 card(i).classList.add('active');S.active=i;setRoom(i,0);
 timer=setInterval(()=>setRoom(i,(S.room[i]+1)%L[i].rooms.length),L[i].live?5000:3500);

 if(L[i].live)startLive(i);
}

 const i=+e.target.dataset.i;if(i!==S.active)play(i)}),{root:feed,threshold:.6});

/* ---------- mortgage: buying power, lenders, pre-approval ---------- */
let lenderFor=null;
function bpSheet(){
 const b=S.bp||{income:95000,debts:450,down:30000,credit:'700–739',first:true};
 sheet(`<h3>Your buying power</h3><p class="sub">An estimate from four answers. No credit check, nothing shared with lenders until you choose one.</p>
  <form class="form" data-bp>
   <div class="two"><label class="fld" for="bpInc">Household income / yr<input id="bpInc" inputmode="numeric" value="${money(b.income)}"></label>
   <label class="fld" for="bpDebt">Monthly debt payments<input id="bpDebt" inputmode="numeric" value="${money(b.debts)}"></label></div>
   <div class="two"><label class="fld" for="bpDown">Cash for down payment<input id="bpDown" inputmode="numeric" value="${money(b.down)}"></label>
   <label class="fld" for="bpCredit">Credit score<select id="bpCredit">${Object.keys(CREDIT).map(k=>`<option${k===b.credit?' selected':''}>${k}</option>`).join('')}</select></label></div>
   <label class="sw" for="bpFirst"><span>First-time buyer<small>Unlocks low-down-payment options when you compare lenders</small></span><input type="checkbox" id="bpFirst"${b.first?' checked':''}></label>
   <div class="result" id="bpOut"></div>
   <button class="btn" type="submit">Use this budget</button>
  </form>
  <p class="fine">Uses common lending limits (28% of income for housing, 43% for all debts) and an example rate. A lender’s pre-approval is what counts.</p>`);
 calcBP();
}
const num=v=>+String(v).replace(/[^0-9.]/g,'')||0;
function readBP(){return{income:num($('#bpInc').value),debts:num($('#bpDebt').value),down:num($('#bpDown').value),credit:$('#bpCredit').value,first:$('#bpFirst').checked}}
function calcBP(){const b=readBP(),r=buyingPower(b);$('#bpOut').innerHTML=`<small>You could buy up to</small><b>${money(r.max)}</b><span>About ${money(r.cap)}/mo for housing at a ${r.rate.toFixed(3)}% example rate (${(r.rate+APR_ADD).toFixed(3)}% APR), 30-year fixed</span>`}

function lendersSheet(i){
 if(i!=null)lenderFor=i;
 const l=lenderFor!=null?L[lenderFor]:null,price=l?l.price:(S.bp?S.bp.max:350000),tax=l?l.tax:.022;
 const adj=S.bp?CREDIT[S.bp.credit]:0;
 const rows=LENDERS.map(x=>{const rate=x.rate+adj,apr=x.apr+adj,p=pay(price,tax,{rate});return{...x,rate,apr,mo:p.total}});
 const key={apr:(a,b)=>a.apr-b.apr,mo:(a,b)=>a.mo-b.mo,fees:(a,b)=>a.fees-b.fees,close:(a,b)=>a.close-b.close}[S.lenderSort];
 const ranked=rows.sort(key);
 const card=x=>`<button class="lender" data-lender="${x.id}" aria-pressed="${S.lender&&S.lender.id===x.id}"><span class="lg">${x.i}</span><b>${esc(x.n)}</b><span class="mo2">${money(x.mo)}<small style="font-family:var(--body);font-size:11px;color:var(--muted)">/mo</small></span>
   <span class="q"><span><strong>${x.rate.toFixed(3)}%</strong> rate</span><span><strong>${x.apr.toFixed(3)}%</strong> APR</span><span><strong>${x.pts}</strong> pts</span><span><strong>${money(x.fees)}</strong> fees</span><span>★ ${x.stars} (${fmtK(x.reviews)})</span><span>~${x.close} days to close</span></span></button>`;
 sheet(`<h3>Compare lenders</h3><p class="sub">${l?esc(l.addr)+' · ':''}${money(price)} price, ${money(pay(price,tax).down)} down, 30-year fixed${S.bp?`, ${esc(S.bp.credit)} credit`:''}.</p>
  <div class="pills" role="group" aria-label="Sort lenders">${[['apr','Lowest APR'],['mo','Lowest payment'],['fees','Lowest fees'],['close','Fastest close']].map(([k,t])=>`<button data-sort="${k}" aria-pressed="${S.lenderSort===k}">${t}</button>`).join('')}</div>
  <span class="spons">All ${ranked.length} local lenders · ranked by ${{apr:'lowest APR',mo:'lowest payment',fees:'lowest fees',close:'fastest close'}[S.lenderSort]}</span>
  <div class="rows">${ranked.map(card).join('')}</div>
  <p class="fine">How lenders pay us: every lender pays the same flat fee to be listed. No lender can pay for a higher spot, and the order is the same for everyone who enters the same numbers. Example quotes for the demo, not offers.</p>`);
}
function lenderPick(id){
 const x=LENDERS.find(z=>z.id===id),adj=S.bp?CREDIT[S.bp.credit]:0;
 sheet(`<h3>Get pre-approved with ${esc(x.n)}</h3><p class="sub">Takes about 10 minutes. ${esc(x.n)} handles your application, not Dreamscrol.</p>
  <div class="steps">
   <div class="step${S.bp?' ok':''}"><span class="k">1</span><span>Your budget<small>${S.bp?'Up to '+money(S.bp.max):'Answer four questions first'}</small></span>${S.bp?'<span class="done">Done</span>':'<button data-open="bp">Start</button>'}</div>
   <div class="step"><span class="k">2</span><span>Share your info with ${esc(x.n)}<small>Name, income, assets. Only this lender sees it.</small></span></div>
   <div class="step"><span class="k">3</span><span>Credit check by the lender<small>A hard inquiry. Shopping several lenders within a few weeks usually counts as one.</small></span></div>
   <div class="step"><span class="k">4</span><span>Pre-approval letter<small>Attach it to offers in one tap</small></span></div></div>
  <div class="pay"><div><span>Quoted rate</span><span>${(x.rate+adj).toFixed(3)}% (${(x.apr+adj).toFixed(3)}% APR)</span></div><div><span>Points and lender fees</span><span>${x.pts} pts · ${money(x.fees)}</span></div></div>
  <button class="btn" data-preapprove="${x.id}"${S.bp?'':' disabled'}>Go to ${esc(x.n)}’s application</button>
  <p class="fine">Dreamscrol doesn’t take loan applications. You apply with the lender directly; demo only.</p>`);
}
function preapprove(id){
 const x=LENDERS.find(z=>z.id===id),adj=CREDIT[S.bp.credit];
 S.lender={...x,rate:x.rate+adj,apr:x.apr+adj};S.preapproved=true;
 renderAllPrices();
 notify({id:'pre',ic:'bank',t:`Pre-approved with ${x.n}`,s:`Up to ${money(S.bp.max)} at ${S.lender.rate.toFixed(3)}%. Your letter is ready to attach to offers.`,act:'letter'});
 letterSheet(true);
}
function letterSheet(fresh){
 sheet(`<h3>${fresh?'You’re pre-approved':'Your pre-approval'}</h3>
  <div class="letter"><small>PRE-APPROVAL LETTER · SAMPLE</small><b>Up to ${money(S.bp.max)}</b><span>${esc(S.lender.n)} · 30-year fixed at ${S.lender.rate.toFixed(3)}% (${S.lender.apr.toFixed(3)}% APR)</span><span>Valid for 90 days. Subject to appraisal and final underwriting.</span></div>
  <p class="muted">Every home in your feed now shows your real payment, and offers include this letter automatically.</p>
  <div class="btns2"><button class="btn" data-close-go="feed">Back to homes</button><button class="btn ghost" data-open="lenders">Compare again</button></div>`);
}

/* ---------- offers go through the buyer's own agent ---------- */
const BUYER_AGENTS=['kiana.sells.detroit','corktown.cass','marcus.tours','royaloak.ryan','fixit.dee'];
const MATCH={ // sample stats used to suggest agents
 'kiana.sells.detroit':{sold:31,areas:['Boston-Edison','Midtown','Lafayette Park'],reply:12,stars:4.9,rev:118,langs:['English']},
 'corktown.cass':{sold:27,areas:['Corktown','Midtown','Lafayette Park'],reply:9,stars:4.9,rev:96,langs:['English','Spanish']},
 'marcus.tours':{sold:19,areas:['Ferndale','Royal Oak'],reply:6,stars:4.8,rev:74,langs:['English','Arabic']},
 'royaloak.ryan':{sold:22,areas:['Royal Oak','Ferndale','Grosse Pointe Park'],reply:15,stars:4.7,rev:61,langs:['English']},
 'fixit.dee':{sold:40,areas:['Bagley','Boston-Edison','Corktown'],reply:20,stars:4.8,rev:143,langs:['English','Bengali']}
};
const HOODS=['Corktown','Boston-Edison','Lafayette Park','Midtown','Bagley','Ferndale','Royal Oak','Grosse Pointe Park'];
const idx=v=>v==null||v===''||v==='null'||v==='undefined'?null:+v;
let matchPick=new Set();
function linkAgentSheet(i){
 const list=[...BUYER_AGENTS].sort(()=>Math.random()-.5);
 sheet(`<h3>Who’s your agent?</h3><p class="sub">Offers go through a licensed agent who works for you. They review it, fill in the purchase agreement and submit it. Dreamscrol never sends offers itself.</p>
  <button class="btn" data-match="${i}">Connect me with a local agent</button>
  <h4>Or link the agent you have</h4>
  <div class="rows">${list.map(h=>`<button class="arow" data-linkagent="${h}" data-for="${i}"><span class="av">${AG[h].i}</span><span>@${h}<small>${esc(AG[h].n)} · ${esc(AG[h].b)}</small></span><em>Link</em></button>`).join('')}</div>
  <form class="compose" data-invite="${i}" style="position:static;padding:0"><input id="invIn" autocomplete="off" placeholder="Not listed? Agent’s email or phone" aria-label="Agent's email or phone"><button type="submit">Invite</button></form>
  <p class="fine">Shown in random order. Agents don’t pay to appear here. Since August 2024, agents need a written buyer agreement with you before touring homes.</p>`);
}
function matchSheet(i){
 const l=i!=null?L[i]:null;matchPick=new Set(l&&HOODS.includes(l.hood)?[l.hood]:[]);
 sheet(`<h3>Find your agent</h3><p class="sub">Three quick answers and we’ll suggest agents who know the area. Free for you, no obligation.</p>
  <form class="form" data-matchform="${i}">
   <div class="fld">Where are you looking?<div class="pills" role="group" aria-label="Neighborhoods">${HOODS.map(h=>`<button type="button" data-hood="${h}" aria-pressed="${matchPick.has(h)}">${h}</button>`).join('')}</div></div>
   <div class="two"><label class="fld" for="mTime">When do you want to buy?<select id="mTime"><option>In 1–3 months</option><option>Right away</option><option>In 3–6 months</option><option>Just looking</option></select></label>
   <label class="fld" for="mBudget">Budget<input id="mBudget" inputmode="numeric" value="${money(S.bp?S.bp.max:(l?l.price:350000))}"></label></div>
   <label class="fld" for="mLang">Language you’d like to work in<select id="mLang"><option>English</option><option>Spanish</option><option>Arabic</option><option>Bengali</option></select></label>
   <button class="btn" type="submit">Show my matches</button></form>`);
}
function matchResults(i){
 const l=i!=null?L[i]:null,lang=$('#mLang').value,listing=l&&!l.ag.owner&&MATCH[l.agent]?l.agent:null;
 const scored=BUYER_AGENTS.filter(h=>h!==listing).map(h=>{const m=MATCH[h];return{h,m,score:m.areas.filter(a=>matchPick.has(a)).length*3+(m.langs.includes(lang)?2:0)+m.sold/50}}).sort((a,b)=>b.score-a.score).slice(0,3);
 const anyLang=scored.some(x=>x.m.langs.includes(lang));
 const row=(h,m,dual)=>`<button class="arow" data-intro="${h}" data-for="${i}"${dual?' data-dual="1"':''}><span class="av">${AG[h].i}</span><span>@${h}<small>${dual?'Listing agent for this home · ':''}${m.sold} homes sold · ${m.areas.slice(0,2).join(', ')}</small><small>Replies in ~${m.reply} min · ★ ${m.stars} (${m.rev})${m.langs.length>1?' · '+m.langs.join(', '):''}</small></span><em>Intro</em></button>`;
 sheet(`<h3>Your matches</h3><p class="sub">Matched on where you’re looking${lang!=='English'?', your language':''} and experience. Agents don’t pay for these introductions.</p>
  ${listing?`<h4>Knows this home best</h4>${row(listing,MATCH[listing],true)}<p class="fine">One agent representing both buyer and seller needs written consent from both sides.</p><h4>Agents who’d work only for you</h4>`:''}
  ${!anyLang?`<p class="muted">No matches who work in ${esc(lang)} yet. Here are the closest matches.</p>`:''}
  <div class="rows">${scored.map(x=>row(x.h,x.m,false)).join('')}</div>
  <p class="fine">You choose who to talk to. Nothing is shared with an agent until you tap Intro.</p>`);
}
function introSheet(h,i,dual){
 const m=MATCH[h];
 sheet(`<h3>Intro to @${h}</h3><p class="sub">${esc(AG[h].n)} · ${esc(AG[h].b)}</p>
  ${dual?`<div class="warn"><b>Heads up:</b> @${h} is the listing agent for this home. Michigan allows one agent to represent both sides only with written consent from you and the seller.</div>`:''}
  <div class="steps">
   <div class="step ok"><span class="k">1</span><span>Intro sent<small>They see your budget, timeline and the home you’re looking at</small></span><span class="done">Done</span></div>
   <div class="step" id="stAccept"><span class="k">2</span><span>@${h} accepts<small>Usually within ${m.reply} minutes</small></span><span class="done" id="stAcceptD" hidden>Done</span></div>
   <div class="step"><span class="k">3</span><span>Sign a buyer agreement<small>Says what they’ll do for you and how they’re paid. Required before touring.</small></span><button data-sign="${h}" data-for="${i}" id="signBtn" disabled>Review</button></div></div>
  <p class="fine">Demo only. The agent accepts automatically after a moment.</p>`);
 setTimeout(()=>{const a=$('#stAccept');if(!a)return;a.classList.add('ok');$('#stAcceptD').hidden=false;$('#signBtn').disabled=false},1600);
}
function linkAgent(h,i,signed){
 S.agent=h;closeSheet();
 notify({id:'agent',ic:'chat',t:`@${h} is now your agent`,s:signed?'Buyer agreement signed. You can tour and make offers together.':'They’ll confirm you have a signed buyer agreement before touring or submitting offers.',act:'none'});
 toast(signed?`Buyer agreement signed with @${h} (demo)`:`@${h} linked as your agent`);
 if(i!=null&&!isNaN(i))setTimeout(()=>offerSheet(i),250);
 if(S.view==='me')renderMe();
}
function offerSheet(i){
 const l=L[i],down=S.bp?Math.min(S.bp.down,l.price):l.price*DOWN,dual=S.agent===l.agent;
 sheet(`<h3>Offer on ${esc(l.addr)}</h3><p class="sub">Listed at ${money(l.price)}. Your agent @${S.agent} reviews this before anything is sent.</p>
  ${dual?'<div class="warn"><b>Heads up:</b> your agent is also the listing agent. Michigan allows this only with written consent from both sides. Your agent will explain.</div>':''}
  <form class="form" data-offerform="${i}">
   <div class="two"><label class="fld" for="ofPrice">Offer price<input id="ofPrice" inputmode="numeric" value="${money(l.price)}"></label>
   <label class="fld" for="ofEm">Earnest money<input id="ofEm" inputmode="numeric" value="${money(Math.max(1000,Math.round(l.price*.01/500)*500))}"></label></div>
   <div class="two"><label class="fld" for="ofDown">Down payment<input id="ofDown" inputmode="numeric" value="${money(down)}"></label>
   <label class="fld" for="ofClose">Close in<select id="ofClose"><option>21 days</option><option selected>30 days</option><option>45 days</option></select></label></div>
   <label class="fld" for="ofFin">Financing<select id="ofFin">${S.preapproved?`<option>Conventional · ${esc(S.lender.n)}</option>`:''}<option>Pre-approved with another lender (upload letter)</option><option>Conventional</option><option>FHA</option>${l.rough?'<option>FHA 203(k) renovation</option>':''}<option>Cash</option></select></label>
   <div class="warn" id="ofOver"${S.bp&&l.price>S.bp.max?'':' hidden'}><b>Above your budget.</b> Your ${S.preapproved?'pre-approval':'buying power'} is up to ${S.bp?money(S.bp.max):''}. Sellers may ask how you’ll cover the difference.</div>
   <label class="sw" for="ofInsp"><span>Inspection contingency<small>Lets you back out or renegotiate after inspection</small></span><input type="checkbox" id="ofInsp" checked></label>
   <label class="sw" for="ofAppr"><span>Appraisal contingency<small>Protects you if the appraisal comes in low</small></span><input type="checkbox" id="ofAppr" checked></label>
   ${S.couples?`<label class="sw" for="ofCo"><span>Add ${PARTNER} as co-buyer<small>${PARTNER} gets a copy to review</small></span><input type="checkbox" id="ofCo" checked></label>`:''}
   ${S.preapproved?`<div class="ok"><b>Pre-approval attached.</b> ${esc(S.lender.n)}, up to ${money(S.bp.max)}.</div>`:`<div class="warn"><b>No pre-approval attached.</b> Sellers take offers more seriously with one from any lender. Upload yours under Financing, or <button type="button" data-open="lenders" data-for="${i}" style="text-decoration:underline;font-weight:800">compare lenders</button>.</div>`}
   <div class="pay"><div class="total"><span>Your monthly at this price</span><span id="ofMo">${money(pay(l.price,l.tax,{down}).total+(l.hoa||0))}</span></div></div>
   <button class="btn" type="submit">Send to @${S.agent} for review</button>
  </form>
  <p class="fine">This isn’t a binding offer. Your agent turns it into the official purchase agreement, and nothing is final until you sign that.</p>`);
}
function sendOffer(i){
 const l=L[i],price=num($('#ofPrice').value)||l.price,fin=$('#ofFin').value;
 S.offers.push({i,price,fin,status:'With your agent'});closeSheet();
 notify({id:'of'+S.offers.length,ic:'offer',t:`@${S.agent} is reviewing your offer on ${l.addr}`,s:`${money(price)} · ${fin}. They’ll call before submitting.`,act:'goto',k:l.key});
 toast(`Sent to @${S.agent}. They’ll call you before submitting.`);
 setTimeout(()=>{const o=S.offers.find(x=>x.i===i&&x.status==='With your agent');if(!o)return;o.status='Submitted';notify({id:'sub'+i,ic:'offer',t:`Offer submitted on ${l.addr}`,s:`@${S.agent} sent it to @${l.agent}. Response expected by Monday 5pm.`,act:'goto',k:l.key})},8000);
}

 postRole=role||postRole;

 const sw=(id,t,s,on=true,dis=false)=>`<label class="sw" for="${id}"><span>${t}<small>${s}</small></span><input type="checkbox" id="${id}"${on?' checked':''}${dis?' disabled':''}></label>`;
 const clipsFor=l=>l.rooms.filter(r=>r!=='From the sellers').slice(0,3).map((r,k)=>`<div class="clip">${scene(l,l.rooms.indexOf(r))}<span>IMG_20${41+k}.mov · 0:${String(9+k*4).padStart(2,'0')}</span></div>`).join('');
 let body='';

 }else if(postRole==='fsbo'){

    <div class="step ok"><span class="k">1</span><span>Name matches county records<small>Wayne County Register of Deeds</small></span><span class="done">Done</span></div>
    <div class="step${S.idOk?' ok':''}"><span class="k">2</span><span>Confirm it’s you<small>Photo ID and a selfie</small></span>${S.idOk?'<span class="done">Done</span>':'<button data-verify>Verify</button>'}</div>
    <div class="step"><span class="k">3</span><span>Add clips<small>We cut the video for you</small></span></div></div>
   <div class="clips">${clipsFor(L[IX.lafayette])}</div>
   <div class="price-tags"><span><b>Free</b> to post</span><span>No commission</span><span>Boosts coming soon</span></div>
   <div>${sw('f1','Let local agents offer help','You can say no. Turn this off any time.',true)}${sw('f2','Show “Verified owner” badge','Appears after step 2',true,true)}</div>
   <button class="btn" data-publish="fsbo"${S.idOk?'':' disabled'}>Publish</button>
   <p class="fine">Dreamscrol never takes a cut of the sale and doesn’t negotiate for you. Buyers’ offers come through their own agents.</p>`;
 }else{
  body=`<label class="fld" for="mmPrice">Your “make me move” price<input id="mmPrice" inputmode="numeric" value="$1,250,000"></label>
   <div class="clips">${clipsFor(L[IX.lakepointe])}</div>
   <div>${sw('u1','Show exact address','Off shows the neighborhood only',false)}${sw('u2','Only show to likely buyers','People who saved similar homes nearby',true)}${sw('u3','Let agents contact me','Off means buyers only',false)}</div>
   <button class="btn" data-publish="unless">Post</button>
   <p class="fine">This isn’t a listing. If you decide to sell with an agent later, they’ll handle the MLS.</p>`;
 }
 sheet(`<h3>Post a home</h3><p class="sub">Drop raw phone clips. We cut the video in about 60 seconds.</p>
  <div class="opts">${opt('agent','I’m an agent','Post your listing, keep your leads')}${opt('fsbo','I’m selling my own home','Verified owners, free to post')}${opt('unless','Not selling… unless?','Name your price and see who bites')}</div>${body}`);
}

/* ---------- views ---------- */
function go(v){
 S.view=v;
 $$('.nav [data-view]').forEach(b=>{if(b.dataset.view===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 const isFeed=v==='feed';
 feed.hidden=!isFeed;$('#top').hidden=!isFeed;
 $('#vMatches').hidden=v!=='matches';$('#vInbox').hidden=v!=='inbox';$('#vMe').hidden=v!=='me';
 if(v==='matches')renderMatches();
 if(v==='inbox')renderInbox();
 if(v==='me')renderMe();
 if(isFeed&&S.active>=0)play(S.active);else stopPlayback();
}
function renderMatches(){
 const el=$('#vMatches');
 const head=`<div class="v-head"><h1>Matches</h1><p>Homes you and ${PARTNER} both liked.</p></div>`;
 if(!S.matches.length){el.innerHTML=head+`<div class="empty">No matches yet. Turn on <b>Couples</b> at the top of the feed, then like homes. When ${PARTNER} has liked the same one, it lands here. In this demo, ${PARTNER} has liked four of the eight.</div>`;return}
 el.innerHTML=head+`<div class="mlist">${S.matches.map(i=>{const l=L[i];return `<button class="mrow" data-goto="${i}"><span class="thumb">${scene(l,0)}</span><span><em>You + ${PARTNER}</em><b>${money(l.price)}</b><span>${esc(l.addr)} · ${esc(l.hood)}</span><span>${l.beds} bd · ${l.baths} ba · ≈ ${money(pay(l.price,l.tax).total)}/mo</span></span></button>`}).join('')}</div>`;
}
function renderInbox(){
 $('#vInbox').innerHTML=`<div class="v-head"><h1>Inbox</h1><p>Your offers, homes you follow, ${PARTNER}’s likes, and replies.</p></div>
  <div class="inbox">${INBOX.map(n=>`<button class="note" data-note="${n.id}"><span class="ic ${n.ic}">${NI[n.ic]}</span><span><b>${esc(n.t)}</b><span>${esc(n.s)}</span></span><i class="${n.unread?'':'read'}"></i></button>`).join('')}</div>`;
}
function taste(){
 const pool=[...new Set([...S.liked,...S.saved,...[...S.watched].map(k=>IX[k])])].map(i=>L[i]);
 if(!pool.length)return null;
 const STY={tudor:'Historic',aframe:'Cabins',farmhouse:'Farmhouse',bungalow:'Victorian',townhouse:'Townhomes',modern:'Mid-century',fixer:'Fixers',unless:'Waterfront'};
 const count=f=>{const m={};pool.forEach(l=>{const k=f(l);m[k]=(m[k]||0)+(S.liked.has(l.id)?2:1)});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
 const avg=pool.reduce((s,l)=>s+l.price,0)/pool.length;
 const band=avg<250000?'Under $250K':avg<400000?'$250K–$400K':avg<600000?'$400K–$600K':'$600K+';
 return [...count(l=>STY[l.style]).slice(0,2),...count(l=>l.hood).slice(0,2)].map(([k])=>k).concat(band);
}
function renderMe(){
 const el=$('#vMe');
 const seg=`<div class="seg"><button data-me="buyer" aria-pressed="${S.me==='buyer'}">Buyer</button><button data-me="agent" aria-pressed="${S.me==='agent'}">Agent</button></div>`;
 if(S.me==='buyer'){
  const t=taste(),gc=Object.keys(S.guesses).length,acc=gc?Math.round(Object.values(S.guesses).reduce((s,g)=>s+g.acc,0)/gc*100):0;
  const saved=[...S.saved].map(i=>L[i]);
  const money_=S.bp?`<div class="big">Up to ${money(S.bp.max)}</div>
    <div class="kv"><span>Lender</span><b>${S.preapproved?esc(S.lender.n)+' · pre-approved':'<button data-open="lenders" style="color:var(--porch);font-weight:800">Compare lenders</button>'}</b></div>
    <div class="kv"><span>Rate</span><b>${rateLine()}</b></div>
    <div class="kv"><span>Your agent</span><b>${S.agent?'@'+S.agent:'<button data-open="linkagent" style="color:var(--porch);font-weight:800">Link or find an agent</button>'}</b></div>
    ${S.offers.length?S.offers.map(o=>`<div class="kv"><span>Offer · ${esc(L[o.i].addr)}</span><b>${money(o.price)} · ${o.status}</b></div>`).join(''):''}
    <button class="btn ghost" data-open="bp">Update my budget</button>`
   :`<p class="muted">Find out what you can afford. Four questions, no credit check. Then compare local lenders side by side.</p><button class="btn" data-open="bp">Find my buying power</button>`;
  el.innerHTML=`${seg}<div class="me-head"><span class="big">You</span><div><h1>${S.signedIn?'Your house hunt':'Guest'}</h1><p>${S.couples?`House hunting with ${PARTNER}`:'Browsing solo'} · Metro Detroit</p></div></div>
   <div class="panel"><h2>Buying power</h2>${money_}</div>
   <div class="stats three"><div class="stat"><b>${S.watched.size}</b><span>Homes watched</span></div><div class="stat"><b>${S.liked.size}</b><span>Liked</span></div><div class="stat"><b>${gc?acc+'%':'—'}</b><span>Guess accuracy</span></div></div>
   <div class="panel"><h2>Your taste</h2>${t?`<div class="taste">${t.map(x=>`<span>${esc(x)}</span>`).join('')}</div><p class="muted">Learned from what you watch, like and save. The feed leans this way.</p>`:'<p class="muted">Watch and like a few homes. Your taste shows up here and the feed starts leaning toward it.</p>'}</div>
   <div class="panel"><h2>Saved</h2>${saved.length?`<div class="grid3">${saved.map(l=>`<button class="tile" data-goto="${l.id}">${scene(l,0)}<span>${short(l.price)}</span></button>`).join('')}</div>`:'<p class="muted">Tap the bookmark on any home to save it. We’ll tell you when the price changes.</p>'}</div>
   <div class="panel"><h2>Settings</h2>
    <label class="sw" for="setMonthly" style="border-top:0;padding-top:0"><span>Lead with monthly payment<small>Shows the payment big and the price small</small></span><input type="checkbox" id="setMonthly"${S.monthly?' checked':''}></label>
    <label class="sw" for="setCouples"><span>Couples mode<small>Match homes with ${PARTNER}</small></span><input type="checkbox" id="setCouples"${S.couples?' checked':''}></label></div>`;
 }else{
  el.innerHTML=`${seg}<div class="me-head"><span class="big">KB</span><div><h1>@kiana.sells.detroit</h1><p>Woodward Realty Group · viewing as an agent (demo)</p></div></div>
   <div class="panel"><h2>Top creators in Metro Detroit this week</h2>
    ${[['fixit.dee',256000],['corktown.cass',184000],['kiana.sells.detroit',171000],['marcus.tours',132000],['royaloak.ryan',104000]].map(([h,v],k)=>`<div class="lb${h==='kiana.sells.detroit'?' me':''}"><span class="n">${k+1}</span><span class="av">${AG[h].i}</span><span>@${h}<small>${esc(AG[h].b)}</small></span><span class="v">${fmtK(v)}</span></div>`).join('')}</div>
   ${reportHTML()}`;
 }
}
function reportHTML(){
 const d=[3100,5400,6200,7900,8800,7600,9200],days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 const x=k=>34+k*(296/6),y=v=>124-v/10000*104;
 const pts=d.map((v,k)=>`${x(k).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
 const grid=[0,5000,10000].map(v=>`<line class="sp-grid" x1="34" x2="330" y1="${y(v)}" y2="${y(v)}"/><text class="sp-lab" x="0" y="${y(v)+4}">${v?v/1000+'K':'0'}</text>`).join('');
 const labs=days.map((t,k)=>`<text class="sp-lab" x="${x(k)}" y="146" text-anchor="middle">${t}</text>`).join('');
 const spark=`<svg class="sp" viewBox="0 0 340 152" role="img" aria-label="Daily views over 7 days, rising from 3.1K to 9.2K">${grid}<polygon class="sp-area" points="${x(0)},124 ${pts} ${x(6)},124"/><polyline class="sp-line" points="${pts}"/><circle class="sp-dot" cx="${x(6)}" cy="${y(9200)}" r="4.5"/>${labs}</svg>`;
 const bar=(t,p)=>`<div class="bar"><span>${t}</span><span>${p}%</span><i><b style="width:${p}%"></b></i></div>`;
 return `<div class="v-head"><h1 style="font-size:24px">Seller report<span class="tag">Sample data</span></h1><p>1840 Chicago Blvd · live 7 days. Bring this to your next listing pitch.</p></div>
  <div class="stats"><div class="stat"><b>48.2K</b><span>Views</span></div><div class="stat"><b>1,206</b><span>Saves</span></div><div class="stat"><b>37</b><span>Tour requests</span></div><div class="stat"><b>2,914</b><span>Shares</span></div></div>
  <div class="panel"><h2>Ready-to-buy signal</h2><p class="callout"><b>14 pre-approved buyers</b> saved this home, and <b>2 offers</b> are being prepared by buyers’ agents.</p><p class="muted">Counts only. Buyers’ details stay private until their agent submits an offer.</p></div>
  <div class="panel"><h2>Views per day</h2>${spark}</div>
  <div class="panel"><p class="callout">This home got <b>3.4× more views</b> than the median Detroit listing this week.</p></div>
  <div class="panel"><h2>Where viewers came from</h2>${bar('For You feed',71)}${bar('Shared by the sellers',18)}${bar('TikTok and Reels reposts',11)}</div>
  <div class="panel"><h2>Buyers keep asking</h2><div class="ask">What does it cost to heat in winter?<span>15 asked</span></div><div class="ask">Is the boiler original?<span>9 asked</span></div><div class="ask">Which schools is it zoned for?<span>7 asked</span></div></div>
  <div class="panel"><h2>Leads</h2><p class="callout">All <b>37 tour requests</b> and <b>64 messages</b> went to you. None were sold to other agents.</p></div>
  <button class="btn" data-send-report>Send report to the sellers</button>`;
}

/* ---------- events ---------- */
function act(a,i){
 const l=L[i];
 switch(a){
  case 'like':like(i);break;
  case 'save':gate('Keep your saves',()=>{S.saved.has(i)?S.saved.delete(i):S.saved.add(i);updateRail(i);if(S.saved.has(i))toast('Saved. We’ll tell you if the price changes.')});break;
  case 'comments':commentsSheet(i);break;
  case 'share':shareSheet(i);break;
  case 'afford':affordSheet(i);break;
  case 'details':detailsSheet(i);break;
  case 'profile':profileSheet(l.agent);break;
  case 'follow':gate('Follow @'+l.agent,()=>{const h=l.agent;S.follow.has(h)?S.follow.delete(h):S.follow.add(h);syncFollow(h)});break;
  case 'tour':gate(l.offmarket?'Message the homeowners':l.fsbo?'Message the owners':'Request a tour',()=>toast(l.offmarket?'Interest sent to the homeowners (demo)':l.fsbo?'Message sent to the owners (demo)':`Tour request sent to @${l.agent}. They’ll send a short written agreement before the tour (MLS rule) (demo)`));break;
  case 'offer':gate('Make an offer',()=>S.agent?offerSheet(i):linkAgentSheet(i));break;
  case 'lock':{const p=l.price,g=+$('#gr'+i).value,acc=Math.max(0,1-Math.abs(g-p)/p),pts=Math.round(acc*100);
   S.guesses[i]={g,acc,pts};S.score+=pts;renderPrice(i);header();
   toast(acc>.95?`Nailed it. +${pts} pts`:acc>.85?`Close. +${pts} pts`:`Off by ${money(Math.abs(g-p))}. +${pts} pts`);break}
 }
}
function openThing(k,forI){
 if(k==='post')postSheet();
 else if(k==='bp')bpSheet();
 else if(k==='lenders')lendersSheet(forI);
 else if(k==='letter')letterSheet(false);
 else if(k==='linkagent')gate('Link your agent',()=>linkAgentSheet(null));
}
$('#app').addEventListener('click',e=>{
 const t=e.target,d=(k)=>t.closest(`[data-${k}]`);
 if(t.matches('[data-close]')){closeSheet();return}
 let el;
 if(el=d('m')){closeSheet();if(el.dataset.m==='tour')gate('Book a tour together',()=>toast(`Tour request sent for you and ${PARTNER} (demo)`));return}
 if(el=d('signup')){S.signedIn=true;closeSheet();const f=S.pending;S.pending=null;toast('Signed in (demo)');f&&setTimeout(f,150);return}
 if(el=d('share')){const k=el.dataset.share;
  if(k==='copy'){const url='dreamscrol.app/h/'+L[+el.dataset.i].key;
   const done=()=>{closeSheet();toast('Link copied')},fail=()=>{const r=document.createRange();r.selectNodeContents($('span',el));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Link selected. Copy it to share.')};
   try{navigator.clipboard.writeText(url).then(done,fail)}catch(_){fail()}return}
  closeSheet();toast(k==='partner'?`Sent to ${PARTNER}`:'Reposted with watermark (demo)');return}
 if(el=d('open')){const f=el.dataset.for;openThing(el.dataset.open,f!=null?+f:undefined);return}
 if(el=d('sort')){S.lenderSort=el.dataset.sort;lendersSheet();return}
 if(el=d('lender')){lenderPick(el.dataset.lender);return}
 if(el=d('preapprove')){preapprove(el.dataset.preapprove);return}
 if(el=d('close-go')){closeSheet();go(el.dataset.closeGo);return}
 if(el=d('offer')){closeSheet();act('offer',+el.dataset.offer);return}
 if(el=d('afford')){affordSheet(+el.dataset.afford);return}
 if(el=d('linkagent')){linkAgent(el.dataset.linkagent,idx(el.dataset.for));return}
 if(el=d('match')){matchSheet(idx(el.dataset.match));return}
 if(el=d('hood')){const h=el.dataset.hood;matchPick.has(h)?matchPick.delete(h):matchPick.add(h);el.setAttribute('aria-pressed',matchPick.has(h));return}
 if(el=d('intro')){introSheet(el.dataset.intro,idx(el.dataset.for),!!el.dataset.dual);return}
 if(el=d('sign')){linkAgent(el.dataset.sign,idx(el.dataset.for),true);return}
 if(el=d('role')){postSheet(el.dataset.role);return}
 if(d('verify')){S.idOk=true;postSheet('fsbo');toast('ID verified (demo)');return}
 if(el=d('publish')){const k=el.dataset.publish;closeSheet();toast(k==='agent'?'Published. Nearby buyers see it first (demo)':k==='fsbo'?'Posted with a Verified owner badge (demo)':'Posted. Only likely buyers will see it (demo)');return}
 if(el=d('view')){go(el.dataset.view);return}
 if(el=d('goto')){closeSheet();goCard(+el.dataset.goto);return}
 if(el=d('jump')){const[i,k]=el.dataset.jump.split(':').map(Number);closeSheet();if(S.active!==i)goCard(i);else{play(i);setRoom(i,k);}return}
 if(el=d('followhome')){const l=L[+el.dataset.followhome];gate('Follow this home',()=>{S.homeFollow.has(l.key)?S.homeFollow.delete(l.key):S.homeFollow.add(l.key);detailsSheet(l.id);if(S.homeFollow.has(l.key))toast('You’ll hear about price changes and the sale.')});return}
 if(el=d('followagent')){const h=el.dataset.followagent;gate('Follow @'+h,()=>{S.follow.has(h)?S.follow.delete(h):S.follow.add(h);syncFollow(h);profileSheet(h)});return}
 if(d('reveal')){S.revealed=true;soldSheet();return}
 if(el=d('note')){const n=INBOX.find(x=>x.id===el.dataset.note);n.unread=false;badges();
  if(n.act==='sold')soldSheet();else if(n.act==='letter')letterSheet(false);else if(n.act==='guess'){if(!S.guess){S.guess=true;renderAllPrices();header()}go('feed')}else if(n.act==='goto')goCard(IX[n.k]);else renderInbox();return}
 if(el=d('me')){S.me=el.dataset.me;renderMe();return}
 if(d('send-report')){toast('Report sent to the sellers (demo)');return}
 if(el=d('act')){const c=el.closest('.card');if(c)act(el.dataset.act,+c.dataset.i)}
});
$('#app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[role=button][data-act]')){const c=e.target.closest('.card');act(e.target.dataset.act,+c.dataset.i)}});
$('#app').addEventListener('change',e=>{
 const id=e.target.id;
 if(id==='setMonthly'){S.monthly=e.target.checked;renderAllPrices()}
 if(id==='setCouples'){setCouples(e.target.checked)}
 if(id==='o8'){$('#pubAgent').disabled=!e.target.checked}
 if(id==='bpCredit'||id==='bpFirst')calcBP();
});
$('#app').addEventListener('input',e=>{
 const id=e.target.id;
 if(e.target.type==='range'){const i=id.slice(2);$('#go'+i).textContent=money(+e.target.value)}
 if(/^bp(Inc|Debt|Down)$/.test(id))calcBP();
 if(id==='ofPrice'||id==='ofDown'){const f=e.target.closest('form'),l=L[+f.dataset.offerform],p=num($('#ofPrice').value),dn=num($('#ofDown').value);if(p){$('#ofMo').textContent=money(pay(p,l.tax,{down:dn}).total+(l.hoa||0));$('#ofOver').hidden=!(S.bp&&p>S.bp.max)}}
});
$('#app').addEventListener('submit',e=>{
 e.preventDefault();const f=e.target;
 if(f.dataset.form!=null){const i=+f.dataset.form,v=$('#cIn',f).value.trim();if(!v)return;
  if(fhFlag(v)){commentsSheet(i,true,v);return}
  gate('Join the conversation',()=>{C[L[i].key].push(['you',v]);updateRail(i);commentsSheet(i)});return}
 if(f.dataset.live!=null){const i=+f.dataset.live,inp=$('#ask'+i),v=inp.value.trim();if(!v)return;
  if(fhFlag(v)){toast('Can’t post that. Fair housing rules don’t allow comments about who should live somewhere.');return}
  gate('Ask the agent',()=>{inp.value='';chatLine(i,'you',v,'you');const a=LIVEANS.find(([r])=>r.test(v));setTimeout(()=>chatLine(i,L[i].agent,a?a[1]:'Good question. Let me show you in a sec.','host'),1300)});return}
 if(f.dataset.bp!=null){const b=readBP(),r=buyingPower(b);S.bp={...b,max:r.max,cap:r.cap,rate:r.rate};if(S.lender&&!S.preapproved)S.lender=null;closeSheet();renderAllPrices();
  toast(`Budget set: up to ${money(r.max)}. Homes now show if they fit.`);if(S.view==='me')renderMe();return}
 if(f.dataset.offerform!=null){sendOffer(+f.dataset.offerform);return}
 if(f.dataset.matchform!=null){if(!matchPick.size){toast('Pick at least one neighborhood.');return}matchResults(idx(f.dataset.matchform));return}
 if(f.dataset.invite!=null){const v=$('#invIn').value.trim();if(!v){toast('Add your agent’s email or phone first.');return}
  closeSheet();toast('Invite sent (demo). You can make offers once they join.');return}
});

let lastTap=0,lastCard=null;
feed.addEventListener('pointerup',e=>{
 if(e.target.closest('button,input,label,output,form,select,.guess,[data-act]'))return;
 const c=e.target.closest('.card[data-i]');if(!c)return;
 const now=Date.now();
 if(now-lastTap<320&&lastCard===c){like(+c.dataset.i,true);burst(c);lastTap=0}else{lastTap=now;lastCard=c}
});

/* toggles */
function header(){
 const g=$('#tGuess'),cp=$('#tCouples');
 g.setAttribute('aria-pressed',S.guess);g.textContent=S.guess?`${S.score} pts`:'Guess';
 cp.setAttribute('aria-pressed',S.couples);cp.textContent=S.couples?`+ ${PARTNER}`:'Couples';
}
function setCouples(on){
 S.couples=on;header();
 if(on){S.liked.forEach(i=>{if(L[i].partner&&!S.matches.includes(i))S.matches.push(i)});badges();toast(`Couples on. When you and ${PARTNER} like the same home, it’s a match.`)}
}
$('#tGuess').addEventListener('click',()=>{S.guess=!S.guess;renderAllPrices();header();if(S.guess)toast('Prices are hidden. Guess before you see them.')});
$('#tCouples').addEventListener('click',()=>setCouples(!S.couples));

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeSheet();return}
 if(S.view!=='feed'||layer.querySelector('.sheet-wrap,.match')||/INPUT|SELECT/.test(document.activeElement.tagName))return;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const cards=$$('.card',feed),cur=cards.findIndex(c=>c.classList.contains('active'));const at=cur<0?cards.indexOf($('#promo')):cur;const n=cards[Math.max(0,Math.min(cards.length-1,at+(e.key==='ArrowDown'?1:-1)))];n.scrollIntoView({behavior:'smooth'})}
});

badges();
play(0);
setTimeout(()=>toast('Swipe up for the next home. Double-tap to like.'),600);
})();
</script>
